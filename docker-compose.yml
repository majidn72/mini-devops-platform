services:

  frontend:
    image: nginx:alpine
    container_name: frontend
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
