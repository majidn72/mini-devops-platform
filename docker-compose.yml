services:

  frontend:
    image: nginx:alpine
    container_name: frontend
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend

    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: devops
      DB_PASSWORD: devops123

    networks:
     - app-network


  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops123
      POSTGRES_DB: appdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
